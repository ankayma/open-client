# GitHub Actions — macOS headless release: standalone `agent`+`mesh` universal binaries
# (no Tauri/GUI/WebView), signed + notarized, for unattended server deployment. Published
# to get.ankayma.com/macos-headless/ (Cloudflare R2), same bucket the GUI DMG-updater
# channel and the Linux curl|sh channel already share.
#
# Separate workflow file from release-macos.yml on purpose — same precedent as Linux/macOS/Windows-GUI already
# being 3 independent workflows on one tag trigger, so a failure/rerun on one artifact class
# never touches another (this one has no Tauri/Node/frontend/DMG involved at all).
#
# Persistence model: plain launchd LaunchDaemon (scripts/install-macos-headless.sh), not
# SMAppService/app-bundle/`.pkg` — see scripts/release-macos-headless.sh header for why.
#
# Required repo secrets (all shared with release-macos.yml — no new ones; notably does
# NOT need APPLE_PROVISION_PROFILE_BASE64, which only the GUI's Associated Domains
# entitlement requires):
#   APPLE_CERT_P12_BASE64 / APPLE_CERT_PASSWORD    Developer ID Application cert
#   APPLE_SIGNING_IDENTITY / APPLE_TEAM_ID
#   APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_P8_BASE64   notarization
#   COSIGN_PRIVATE_KEY / COSIGN_PASSWORD
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT / R2_BUCKET_MACOS
name: release-macos-headless

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

jobs:
  build-sign-notarize:
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned via rust-toolchain.toml)
        run: rustup show

      - name: Import signing certificate into a temporary keychain
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release-macos-headless.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$APPLE_CERT_P12_BASE64" | base64 -d -o "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 -d -o "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Install cosign
        env:
          COSIGN_VERSION: v2.4.1 # [A — keep in step with release-linux.yml]
        run: |
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-darwin-arm64" -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

      - name: Build + sign + notarize (scripts/release-macos-headless.sh)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" | base64 -d > cosign.key
          bash scripts/release-macos-headless.sh
          rm -f cosign.key

      - name: Remove temporary keychain + API key
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Cheap, real verification that `mesh` — never built for macOS anywhere before this
      # workflow — actually works, not just compiles/signs/notarizes.
      - name: Smoke-test mesh genkey/pubkey round-trip
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          MESH="dist/$VERSION/mesh-macos-universal"
          PRIV="$("$MESH" genkey)"
          [ -n "$PRIV" ]
          PUB="$(echo "$PRIV" | "$MESH" pubkey)"
          [ -n "$PUB" ]
          echo "✓ mesh genkey | mesh pubkey -> $PUB"

      - name: Publish to R2 (get.ankayma.com/macos-headless/)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          EP="${{ secrets.R2_ENDPOINT }}"
          aws s3 sync "dist/$VERSION/" "s3://${{ secrets.R2_BUCKET_MACOS }}/macos-headless/$VERSION/" --endpoint-url "$EP"
          aws s3 sync "dist/$VERSION/" "s3://${{ secrets.R2_BUCKET_MACOS }}/macos-headless/latest/" --endpoint-url "$EP"
          aws s3 cp "dist/$VERSION/install-macos-headless.sh" "s3://${{ secrets.R2_BUCKET_MACOS }}/macos-headless/install.sh" --endpoint-url "$EP"

      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*/agent-macos-universal"
