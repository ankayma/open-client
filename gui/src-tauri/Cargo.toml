[package]
name = "ankayma-gui"
version = "1.1.8"
description = "Ankayma GUI shell (Tauri 2)"
authors = []
license = "LicenseRef-Elastic-2.0"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `tray-icon` enables the macOS menu-bar tray (Part D §D.3, desktop only — gated
# #[cfg(desktop)] so mobile is unaffected). The status dot is drawn from raw RGBA
# (tauri::image::Image), so no image-format feature is needed. [T:A.1.21] pinned.
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
# Deep-link sign-in: the browser "Open Ankayma" button opens `ankayma://auth?token=…`
# straight into the app instead of copy/paste. single-instance focuses the running
# app (and forwards the URL on Windows/Linux) instead of launching a 2nd copy.
# See docs/auth-deeplink-signin-spec.md.
tauri-plugin-deep-link = "2"
# Parse the `ankayma://auth?token=…` deep-link URL. Same 2.x as the deep-link
# plugin's re-export (cargo unifies), so the types line up.
url = "2"
# Control-plane calls go through agent-core (A.1.1). `open` launches the system
# browser for the GitHub OAuth start on DESKTOP. On iOS the `open` crate no-ops
# (no `open`/`xdg-open` binary) so we bridge to Swift `UIApplication.open` via the
# C-ABI in ios/AppSupport/OpenUrlBridge.swift instead (see src/vpn.rs). [T:A.1.21]
agent-core = { workspace = true }
open = "5"
# [T:A.1.21] base64 for streaming SSH terminal bytes to xterm.js as JSON-safe
# strings (F-2 §H.2.2). Already in-tree via agent-core; declared for direct use.
base64 = "0.22"
# gethostname(2) for device_hostname(); already a transitive dep via agent-core
# but must be declared directly for use in this crate. [T:A.1.21]
libc = "0.2"
# [T:A.1.21] first-party Tauri plugin — in-app QR scan for the node-invite flow
# (welcome "Scan QR"). Mobile-only at runtime (native camera scanner); registered
# under #[cfg(mobile)] in lib.rs. Pinned.
tauri-plugin-barcode-scanner = "2.4.5"

# single-instance + updater are desktop-only (neither crate has a mobile
# target). Auto-update ships for macOS first (Part D release pipeline §3.3);
# Linux distributes via apt/yum instead (§4), so the endpoint/pubkey config in
# tauri.conf.json is inert there for now. Restart-after-update uses
# AppHandle::restart(), inherent to tauri core (2.11+) — no
# tauri-plugin-process needed [T — verified via docs.rs, that crate only
# exports `init()`, no ProcessExt].
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Native FIDO2 security-key ceremony (E-7 Phase 3 / AAL3). WKWebView cannot do
# security keys via navigator.credentials at all, so the ceremony has to go through
# AuthenticationServices — see docs/webauthn-security-key-decision.md. Same objc2
# family already used on iOS (below); the framework crate requires objc2 >=0.6.2.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-authentication-services = "0.3.2"
smappservice-rs = "0.1.3"
# E-7 Touch ID step-up factor — Secure Enclave key + biometryCurrentSet, no
# devicePasscode fallback. OSX_10_15 is required for Location::DataProtectionKeychain,
# which is not optional here: "keys stored in the Secure Enclave _must_ use this
# keychain" [T:security-framework-3.7.0 src/item.rs Location docs]. Without it the key
# is created but never persisted, which is the bug fixed in this commit.
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
objc2-local-authentication = "0.3.2"
core-foundation = "0.10"
security-framework-sys = "2.17"

# Windows-only: win_service_client's blocking named-pipe I/O to the always-on
# Ankayma service (CreateFileW/ReadFile/WriteFile/WaitNamedPipeW) — Change 4 of
# docs/windows-daemon-lifecycle-decision.md. `ensure_installed`/upgrade stop-start
# shell out to sc.exe (elevated Start-Process) instead, so no windows-service
# crate needed here — only agent-daemon hosts the service itself.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # CreateFileW's signature references SECURITY_ATTRIBUTES; ReadFile/WriteFile's
    # reference OVERLAPPED — windows-sys gates each fn behind the feature owning
    # its parameter types, not just the feature "for" the function itself.
    # Confirmed the hard way: this compiled clean on macOS only because the whole
    # file is #[cfg(target_os = "windows")] (nothing to check there) — the real
    # Windows build (T490) is what caught it.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

# iOS-only: send one Objective-C message to the WKWebView's scroll view so it
# stops double-applying the home-indicator safe area (see run() setup). objc2 is
# already in the tree transitively (via wry/tao); we pin the same 0.6 line and
# promote it to a direct dep rather than pull a third-party inset plugin. [A.1.21]
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
# Same E-7 step-up factors as macOS. iOS is the easier side of the two: the data
# protection keychain is the ONLY keychain there, so the legacy-keychain trap that
# made the macOS Touch ID key unfindable cannot occur. Face ID additionally requires
# NSFaceIDUsageDescription in Info.plist — WITHOUT IT THE APP CRASHES rather than
# returning an error — injected via scripts/ios-postinit.sh §3d.
# [T:developer.apple.com/documentation/localauthentication]
objc2-foundation = "0.3"
objc2-local-authentication = "0.3.2"
objc2-authentication-services = "0.3.2"
security-framework = "3.7.0"
core-foundation = "0.10"
security-framework-sys = "2.17"

# Android-only: JNI bridge to AnkaymaVpnService (VpnService owns the TUN fd + calls
# nativeStart/Stop; Rust calls protect/bindSocket/forwardDns back). socket2 lets the
# control-plane loopback proxy create-then-bind-then-connect (std TcpStream connects
# on creation, too late to bind the fd to the non-VPN network). [A.1.21]
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
socket2 = "0.6"
